server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Requesty do API przekazujemy do kontenera backendu (nginx Laravela) - bez problemów z CORS.
    location /api/ {
        proxy_pass http://nginx:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA: każda inna ścieżka (np. /meal-log) ładuje index.html, a trasę obsługuje vue-router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
