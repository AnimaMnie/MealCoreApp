services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        volumes:
            - .:/var/www
        depends_on:
            - db

    # Worker kolejki - wykonuje zadania asynchroniczne (listener UpdateDailySummary).
    queue:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        command: php artisan queue:work --tries=3 --sleep=1
        restart: unless-stopped
        volumes:
            - .:/var/www
        depends_on:
            - db

    nginx:
        image: nginx:alpine
        ports:
            - "8080:80"
        volumes:
            - .:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app

    # Frontend Vue (zbudowany i serwowany przez nginx, /api przekazywane do backendu).
    frontend:
        build:
            context: ./frontend
        ports:
            - "8081:80"
        depends_on:
            - nginx

    db:
        image: postgres:16
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        ports:
            - "5433:5432"
        volumes:
            - pg-data:/var/lib/postgresql/data
            - ./docker/postgres/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql

volumes:
    pg-data:
