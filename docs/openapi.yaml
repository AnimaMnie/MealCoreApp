                        items:
                          -
                            id: 3
                            product_id: 3
                            product_name: 'Miska z łososiem'
                            grams: 420
                            nutrition:
                              kcal: 680.4
                              protein: 34
                              carbs: 52.1
                              fat: 33.2
                        totals:
                          kcal: 680.4
                          protein: 34
                          carbs: 52.1
                          fat: 33.2
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 2
                        meal_date:
                          type: string
                          example: '2026-11-20'
                        meal_type:
                          type: string
                          example: lunch
                        name:
                          type: string
                          example: Obiad
                        items:
                          type: array
                          example:
                            -
                              id: 3
                              product_id: 3
                              product_name: 'Miska z łososiem'
                              grams: 420
                              nutrition:
                                kcal: 680.4
                                protein: 34
                                carbs: 52.1
                                fat: 33.2
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                                example: 3
                              product_id:
                                type: integer
                                example: 3
                              product_name:
                                type: string
                                example: 'Miska z łososiem'
                              grams:
                                type: integer
                                example: 420
                              nutrition:
                                type: object
                                properties:
                                  kcal:
                                    type: number
                                    example: 680.4
                                  protein:
                                    type: integer
                                    example: 34
                                  carbs:
                                    type: number
                                    example: 52.1
                                  fat:
                                    type: number
                                    example: 33.2
                        totals:
                          type: object
                          properties:
                            kcal:
                              type: number
                              example: 680.4
                            protein:
                              type: integer
                              example: 34
                            carbs:
                              type: number
                              example: 52.1
                            fat:
                              type: number
                              example: 33.2
                  links:
                    type: object
                    properties:
                      first:
                        type: string
                        example: 'http://localhost:8080/api/meals?date=2026-11-20&meal_type=lunch&per_page=10&page=1'
                      last:
                        type: string
                        example: 'http://localhost:8080/api/meals?date=2026-11-20&meal_type=lunch&per_page=10&page=1'
                      prev:
                        type: string
                        example: null
                        nullable: true
                      next:
                        type: string
                        example: null
                        nullable: true
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      from:
                        type: integer
                        example: 1
                      last_page:
                        type: integer
                        example: 1
                      links:
                        type: array
                        example:
                          -
                            url: null
                            label: '&laquo; Poprzednia'
                            page: null
                            active: false
                          -
                            url: 'http://localhost:8080/api/meals?date=2026-11-20&meal_type=lunch&per_page=10&page=1'
                            label: '1'
                            page: 1
                            active: true
                          -
                            url: null
                            label: 'Następna &raquo;'
                            page: null
                            active: false
                        items:
                          type: object
                          properties:
                            url:
                              type: string
                              example: null
                              nullable: true
                            label:
                              type: string
                              example: '&laquo; Poprzednia'
                            page:
                              type: string
                              example: null
