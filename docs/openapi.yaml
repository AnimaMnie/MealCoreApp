                    first: 'http://localhost:8080/api/meals?date=2026-11-20&meal_type=lunch&per_page=10&page=1'
                    last: 'http://localhost:8080/api/meals?date=2026-11-20&meal_type=lunch&per_page=10&page=1'
                    prev: null
                    next: null
                  meta:
                    current_page: 1
                    from: 1
                    last_page: 1
                    links:
                      -
                        url: null
                        label: '&laquo; Poprzednia'
                        page: null
