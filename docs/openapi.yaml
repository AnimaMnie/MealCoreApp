openapi: 3.0.3
info:
  title: 'MealCore API'
  description: 'REST API aplikacji MealCore: dziennik posiłków z liczeniem kalorii, baza produktów, grupy ze wspólną listą zakupów i panel administratora.'
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8080'
tags:
  -
    name: Autoryzacja
    description: "\nRejestracja, logowanie i wylogowanie (tokeny Sanctum)."
  -
    name: Produkty
    description: "\nBaza produktów (wartości na 100 g). Odczyt: każdy zalogowany, zapis: tylko admin.\n\nWarstwa HTTP: przyjmuje request, deleguje do serwisu, zwraca Resource (DTO)."
  -
    name: Posiłki
    description: "\nDziennik posiłków zalogowanego użytkownika z wyliczaniem kalorii i makroskładników."
  -
    name: Grupy
    description: "\nGrupy użytkowników. Widzą je członkowie, zarządza właściciel."
  -
    name: 'Lista zakupów'
    description: "\nWspólna lista zakupów grupy - dostęp tylko dla członków grupy."
  -
    name: 'Panel admina'
    description: "\nZarządzanie użytkownikami - tylko dla roli admin."
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Token otrzymasz z <code>POST /api/auth/login</code> lub <code>POST /api/auth/register</code>. Wysyłaj go w nagłówku <code>Authorization: Bearer {TOKEN}</code>.'
security:
  -
    default: []
paths:
  /api/auth/register:
    post:
      summary: 'Rejestracja - zwraca użytkownika i token Bearer.'
      operationId: rejestracjaZwracaUytkownikaITokenBearer
      description: ''
      parameters: []
      responses: {}
      tags:
        - Autoryzacja
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Pole value może mieć najwyżej 50 znaków.'
                  example: b
                email:
                  type: string
                  description: 'Pole value musi być prawidłowym adresem e-mail. Pole value może mieć najwyżej 255 znaków.'
                  example: zbailey@example.net
                password:
                  type: string
                  description: ''
                  example: architecto
              required:
                - name
                - email
                - password
      security: []
  /api/auth/login:
    post:
      summary: 'Logowanie - zwraca token, który wysyłasz w nagłówku Authorization: Bearer {token}.'
      operationId: logowanieZwracaTokenKtryWysyaszWNagwkuAuthorizationBearertoken
      description: ''
      parameters: []
      responses: {}
      tags:
        - Autoryzacja
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Pole value musi być prawidłowym adresem e-mail.'
                  example: gbailey@example.net
                password:
                  type: string
                  description: ''
                  example: '|]|{+-'
              required:
                - email
                - password
      security: []
  /api/auth/logout:
    post:
      summary: ''
      operationId: postApiAuthLogout
      description: ''
      parameters: []
      responses: {}
      tags:
        - Autoryzacja
  /api/auth/me:
    get:
      summary: 'Dane zalogowanego użytkownika.'
      operationId: daneZalogowanegoUytkownika
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 2
                    name: alex
                    email: alex@mealcore.com
                    role: user
                    daily_calorie_goal: 2250
                    created_at: '2026-11-20T20:38:10+00:00'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 2
                      name:
                        type: string
                        example: alex
                      email:
                        type: string
                        example: alex@mealcore.com
                      role:
                        type: string
                        example: user
                      daily_calorie_goal:
                        type: integer
                        example: 2250
                      created_at:
                        type: string
                        example: '2026-11-20T20:38:10+00:00'
      tags:
        - Autoryzacja
  /api/products:
    get:
      summary: 'Lista produktów (paginacja + wyszukiwanie).'
      operationId: listaProduktwpaginacja+Wyszukiwanie
      description: ''
      parameters:
        -
          in: query
          name: q
          description: 'Szukaj po nazwie.'
          example: chicken
          required: false
          schema:
            type: string
            description: 'Szukaj po nazwie.'
            example: chicken
        -
          in: query
          name: category
          description: 'Filtr kategorii.'
          example: Protein
          required: false
          schema:
            type: string
            description: 'Filtr kategorii.'
            example: Protein
        -
          in: query
          name: per_page
          description: 'Liczba wyników na stronę (1-50).'
          example: 10
          required: false
          schema:
            type: integer
            description: 'Liczba wyników na stronę (1-50).'
            example: 10
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data: []
                  links:
                    first: 'http://localhost:8080/api/products?q=chicken&category=Protein&per_page=10&page=1'
                    last: 'http://localhost:8080/api/products?q=chicken&category=Protein&per_page=10&page=1'
                    prev: null
                    next: null
                  meta:
                    current_page: 1
                    from: null
                    last_page: 1
                    links:
                      -
                        url: null
                        label: '&laquo; Poprzednia'
                        page: null
                        active: false
                      -
                        url: 'http://localhost:8080/api/products?q=chicken&category=Protein&per_page=10&page=1'
                        label: '1'
                        page: 1
                        active: true
                      -
                        url: null
                        label: 'Następna &raquo;'
                        page: null
                        active: false
                    path: 'http://localhost:8080/api/products'
                    per_page: 7
                    to: null
                    total: 0
                properties:
                  data:
                    type: array
                    example: []
                  links:
                    type: object
                    properties:
                      first:
                        type: string
                        example: 'http://localhost:8080/api/products?q=chicken&category=Protein&per_page=10&page=1'
                      last:
                        type: string
                        example: 'http://localhost:8080/api/products?q=chicken&category=Protein&per_page=10&page=1'
                      prev:
                        type: string
                        example: null
                        nullable: true
                      next:
                        type: string
                        example: null
                        nullable: true
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      from:
                        type: string
                        example: null
                        nullable: true
                      last_page:
                        type: integer
                        example: 1
                      links:
                        type: array
                        example:
                          -
                            url: null
                            label: '&laquo; Poprzednia'
                            page: null
                            active: false
                          -
                            url: 'http://localhost:8080/api/products?q=chicken&category=Protein&per_page=10&page=1'
                            label: '1'
                            page: 1
                            active: true
                          -
                            url: null
                            label: 'Następna &raquo;'
                            page: null
                            active: false
                        items:
                          type: object
                          properties:
                            url:
                              type: string
                              example: null
                              nullable: true
                            label:
                              type: string
                              example: '&laquo; Poprzednia'
                            page:
                              type: string
                              example: null
                              nullable: true
                            active:
                              type: boolean
                              example: false
                      path:
                        type: string
                        example: 'http://localhost:8080/api/products'
                      per_page:
                        type: integer
                        example: 7
                      to:
                        type: string
                        example: null
                        nullable: true
                      total:
                        type: integer
                        example: 0
      tags:
        - Produkty
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                q:
                  type: string
                  description: 'Pole value może mieć najwyżej 100 znaków.'
                  example: b
                  nullable: true
                category:
                  type: string
                  description: 'Pole value może mieć najwyżej 40 znaków.'
                  example: 'n'
                  nullable: true
                per_page:
                  type: integer
                  description: 'Pole value musi wynosić co najmniej 1. Pole value nie może być większe niż 50.'
                  example: 7
                  nullable: true
    post:
      summary: ''
      operationId: postApiProducts
      description: ''
      parameters: []
      responses: {}
      tags:
        - Produkty
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Pole value może mieć najwyżej 120 znaków.'
                  example: b
                category:
                  type: string
                  description: ''
                  example: Nabiał
                  enum:
                    - 'Warzywa i owoce'
                    - Nabiał
                    - Pieczywo
                    - Białko
                    - Inne
                kcal_100g:
                  type: number
                  description: 'Pole value musi wynosić co najmniej 0. Pole value nie może być większe niż 900.'
                  example: 22
                protein_100g:
                  type: number
                  description: 'Pole value musi wynosić co najmniej 0. Pole value nie może być większe niż 100.'
                  example: 7
                carbs_100g:
                  type: number
                  description: 'Pole value musi wynosić co najmniej 0. Pole value nie może być większe niż 100.'
                  example: 16
                fat_100g:
                  type: number
                  description: 'Pole value musi wynosić co najmniej 0. Pole value nie może być większe niż 100.'
                  example: 17
              required:
                - name
                - kcal_100g
  '/api/products/{product_id}':
    get:
      summary: ''
      operationId: getApiProductsProduct_id
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    name: 'Tost z awokado na zakwasie'
                    category: Pieczywo
                    per_100g:
                      kcal: 124
                      protein: 5.6
                      carbs: 12.8
                      fat: 6.4
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'Tost z awokado na zakwasie'
                      category:
                        type: string
                        example: Pieczywo
                      per_100g:
                        type: object
                        properties:
                          kcal:
                            type: integer
                            example: 124
                          protein:
                            type: number
                            example: 5.6
                          carbs:
                            type: number
                            example: 12.8
                          fat:
                            type: number
                            example: 6.4
      tags:
        - Produkty
    put:
      summary: ''
      operationId: putApiProductsProduct_id
      description: ''
      parameters: []
      responses: {}
      tags:
        - Produkty
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Pole value może mieć najwyżej 120 znaków.'
                  example: b
                category:
                  type: string
                  description: ''
                  example: Nabiał
                  enum:
                    - 'Warzywa i owoce'
                    - Nabiał
                    - Pieczywo
                    - Białko
                    - Inne
                kcal_100g:
                  type: number
                  description: 'Pole value musi wynosić co najmniej 0. Pole value nie może być większe niż 900.'
                  example: 22
                protein_100g:
                  type: number
                  description: 'Pole value musi wynosić co najmniej 0. Pole value nie może być większe niż 100.'
                  example: 7
                carbs_100g:
                  type: number
                  description: 'Pole value musi wynosić co najmniej 0. Pole value nie może być większe niż 100.'
                  example: 16
                fat_100g:
                  type: number
                  description: 'Pole value musi wynosić co najmniej 0. Pole value nie może być większe niż 100.'
                  example: 17
    delete:
      summary: ''
      operationId: deleteApiProductsProduct_id
      description: ''
      parameters: []
      responses: {}
      tags:
        - Produkty
    parameters:
      -
        in: path
        name: product_id
        description: 'The ID of the product.'
        example: 1
        required: true
        schema:
          type: integer
  /api/meals/summary:
    get:
      summary: 'Dzienne podsumowanie: suma kcal i makro oraz ile zostało do celu.'
      operationId: dziennePodsumowanieSumaKcalIMakroOrazIleZostaoDoCelu
      description: ''
      parameters:
        -
          in: query
          name: date
          description: 'Dzień w formacie Y-m-d (domyślnie dziś).'
          example: '2026-11-20'
          required: false
          schema:
            type: string
            description: 'Dzień w formacie Y-m-d (domyślnie dziś).'
            example: '2026-11-20'
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    date: '2026-11-20'
                    meals_count: 3
                    totals:
                      kcal: 1179.7
                      protein: 60.1
                      carbs: 102.7
                      fat: 54.6
                    calorie_goal: 2250
                    remaining_kcal: 1070.3
                    goal_exceeded: false
                    goal_progress_percent: 52
                properties:
                  data:
                    type: object
                    properties:
                      date:
                        type: string
                        example: '2026-11-20'
                      meals_count:
                        type: integer
                        example: 3
                      totals:
                        type: object
                        properties:
                          kcal:
                            type: number
                            example: 1179.7
                          protein:
                            type: number
                            example: 60.1
                          carbs:
                            type: number
                            example: 102.7
                          fat:
                            type: number
                            example: 54.6
                      calorie_goal:
                        type: integer
                        example: 2250
                      remaining_kcal:
                        type: number
                        example: 1070.3
                      goal_exceeded:
                        type: boolean
                        example: false
                      goal_progress_percent:
                        type: integer
                        example: 52
      tags:
        - Posiłki
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                date:
                  type: string
                  description: 'Must be a valid date in the format <code>Y-m-d</code>.'
                  example: '2026-11-20'
                  nullable: true
  /api/meals/history:
    get:
      summary: 'Historia ostatnich dni (statystyki tygodnia/miesiąca).'
      operationId: historiaOstatnichDnistatystykiTygodniamiesica
      description: "Dane pochodzą z tabeli daily_summaries, którą asynchronicznie uzupełnia kolejka\npo każdej zmianie w dzienniku posiłków."
      parameters:
        -
          in: query
          name: days
          description: 'Liczba dni wstecz (1-31, domyślnie 7).'
          example: 7
          required: false
          schema:
            type: integer
            description: 'Liczba dni wstecz (1-31, domyślnie 7).'
            example: 7
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    days:
                      -
                        date: '2026-11-20'
                        meals_count: 3
                        kcal: 1179.7
                        protein: 60.1
                        carbs: 102.7
                        fat: 54.6
                        goal_exceeded: false
                    calorie_goal: 2250
                    average_kcal: 1179.7
                    days_logged: 1
                    days_goal_exceeded: 0
                properties:
                  data:
                    type: object
                    properties:
                      days:
                        type: array
                        example:
                          -
                            date: '2026-11-20'
                            meals_count: 3
                            kcal: 1179.7
                            protein: 60.1
                            carbs: 102.7
                            fat: 54.6
                            goal_exceeded: false
                        items:
                          type: object
                          properties:
                            date:
                              type: string
                              example: '2026-11-20'
                            meals_count:
                              type: integer
                              example: 3
                            kcal:
                              type: number
                              example: 1179.7
                            protein:
                              type: number
                              example: 60.1
                            carbs:
                              type: number
                              example: 102.7
                            fat:
                              type: number
                              example: 54.6
                            goal_exceeded:
                              type: boolean
                              example: false
                      calorie_goal:
                        type: integer
                        example: 2250
                      average_kcal:
                        type: number
                        example: 1179.7
                      days_logged:
                        type: integer
                        example: 1
                      days_goal_exceeded:
                        type: integer
                        example: 0
      tags:
        - Posiłki
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                days:
                  type: integer
                  description: 'Pole value musi wynosić co najmniej 1. Pole value nie może być większe niż 31.'
                  example: 1
                  nullable: true
  /api/meals:
    get:
      summary: 'Posiłki zalogowanego użytkownika (paginacja + filtr daty i rodzaju).'
      operationId: posikiZalogowanegoUytkownikapaginacja+FiltrDatyIRodzaju
      description: ''
      parameters:
        -
          in: query
          name: date
          description: 'Dzień w formacie Y-m-d.'
          example: '2026-11-20'
          required: false
          schema:
            type: string
            description: 'Dzień w formacie Y-m-d.'
            example: '2026-11-20'
        -
          in: query
          name: meal_type
          description: 'Rodzaj posiłku.'
          example: lunch
          required: false
          schema:
            type: string
            description: 'Rodzaj posiłku.'
            example: lunch
        -
          in: query
          name: per_page
          description: 'Liczba wyników na stronę (1-50).'
          example: 10
          required: false
          schema:
            type: integer
            description: 'Liczba wyników na stronę (1-50).'
            example: 10
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 2
                      meal_date: '2026-11-20'
                      meal_type: lunch
                      name: Obiad
                      items:
                        -
                          id: 3
